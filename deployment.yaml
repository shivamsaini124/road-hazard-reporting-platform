apiVersion: apps/v1
kind: Deployment

metadata:
  name: road-hazard-reporting-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: road-hazard-reporting-platform

  template:
    metadata:
      labels:
        app: road-hazard-reporting-platform

    spec:
      containers:
        - name: road-hazard-reporting-platform
          image: shivam3294/road-hazard-reporting-platform:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service

metadata:
  name: road-hazard-reporting-platform-service

spec:
  type: NodePort

  selector:
    app: road-hazard-reporting-platform

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080